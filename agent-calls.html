<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2138">
<meta name="robots" content="noindex,nofollow">
<title>Agent Call Block | Scott Smith</title>
<style>
:root{--navy:#0b2138;--navy-3:#173b60;--gold:#b89252;--gold-soft:#eadfc9;--ivory:#f4f0e7;--paper:#fffdf9;--ink:#132236;--muted:#667384;--line:#ddd7ca;--green:#2f7a5d;--green-soft:#e8f3ed;--red:#9a3f48;--red-soft:#fbedef;--amber:#9b6b1f;--amber-soft:#fff4df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 12% 0%,rgba(184,146,82,.10),transparent 27rem),var(--ivory);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:40px}
.app-header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;min-height:66px;padding:10px 16px;color:#fff;background:rgba(11,33,56,.97);border-bottom:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px)}
.brand-mark{width:34px;height:34px;border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;border-radius:50%;color:var(--gold-soft);font:700 18px Georgia,serif;flex:none}
.eyebrow{color:var(--gold-soft);font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
.htitle{font:600 20px/1 Georgia,serif}
.counts{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.counts b{font:700 18px Inter;display:block;line-height:1}
.counts span{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.wrap{width:min(640px,calc(100% - 24px));margin:16px auto}
.progress{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.ptrack{flex:1;height:8px;border-radius:99px;background:#e5dfd3;overflow:hidden}
.pfill{height:100%;width:0;background:var(--gold);transition:.25s}
.ptext{font-size:12px;color:var(--muted);white-space:nowrap;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-left:5px solid var(--navy-3);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 12px rgba(11,33,56,.06)}
.card.done{opacity:.5}
.aname{font:600 21px/1.15 Georgia,serif;margin:0}
.tag{display:inline-block;margin-top:5px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-soft);border-radius:99px;padding:3px 9px}
.tag.retry{color:var(--amber);border-color:#ecd9ad;background:var(--amber-soft)}
.phone{margin:9px 0 14px;font:600 17px 'Inter';color:#333;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.acts a,.acts button{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:14px;font-weight:800;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer}
.call{background:var(--green);color:#fff;border-color:var(--green)}
.text{background:var(--gold);color:#fff;border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin-top:9px}
.worked{background:var(--navy);color:#fff;border-color:var(--navy)}
.na{background:#fff;color:#6b5a1a;border-color:#e6d9ad}
.skip{background:#fff;color:var(--muted);border-color:var(--line)}
.hint{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.4}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h2{font:600 24px Georgia,serif;color:var(--ink);margin:0 0 8px}
.bigbtn{display:inline-block;margin-top:14px;background:var(--navy);color:#fff;border:0;border-radius:12px;padding:14px 22px;font-weight:800;cursor:pointer}
.loading{text-align:center;color:var(--muted);padding:30px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--navy);color:#fff;border-radius:99px;padding:10px 16px;font-size:13px;font-weight:800;transition:.2s;z-index:60}
.toast.show{opacity:.97;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="srGate" style="position:fixed;inset:0;z-index:99999;background:#0b2138;display:flex;align-items:center;justify-content:center;font-family:Inter,Arial,sans-serif;padding:16px">
  <form id="srGateForm" style="width:min(360px,92%);background:#fffdf9;border-radius:16px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.45)">
    <div style="text-align:center;margin-bottom:18px">
      <div style="width:46px;height:46px;border:1px solid #b89252;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;color:#b89252;font:700 21px Georgia,serif">S</div>
      <div style="font:800 10px Inter,Arial;letter-spacing:.16em;text-transform:uppercase;color:#b89252">Smith Approves Me</div>
      <div style="font:600 22px Georgia,serif;color:#0b2138;margin-top:4px">Private Login</div>
    </div>
    <input id="srU" placeholder="Username" autocomplete="username" autocapitalize="none" style="width:100%;box-sizing:border-box;border:1px solid #d7d1c6;border-radius:10px;padding:12px;margin-bottom:10px;font-size:16px">
    <input id="srP" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;box-sizing:border-box;border:1px solid #d7d1c6;border-radius:10px;padding:12px;font-size:16px">
    <div id="srErr" style="color:#9a3f48;font-size:13px;min-height:18px;margin:6px 0"></div>
    <button type="submit" id="srBtn" style="width:100%;background:#0b2138;color:#fff;border:0;border-radius:10px;padding:13px;font-weight:800;font-size:15px;cursor:pointer">Sign in</button>
  </form>
</div>
<script>(function(){var GATE="https://qfhfuesnjfuwfujhvgpa.supabase.co/functions/v1/gate";function ck(n){var m=document.cookie.match('(?:^|; )'+n+'=([^;]*)');return m?decodeURIComponent(m[1]):''}var g=document.getElementById('srGate');function reveal(){if(g&&g.parentNode)g.parentNode.removeChild(g)}var t=ck('sr_gate');if(t){fetch(GATE+'?verify='+encodeURIComponent(t)).then(function(r){return r.json()}).then(function(d){if(d&&d.ok)reveal()}).catch(function(){})}document.getElementById('srGateForm').addEventListener('submit',function(e){e.preventDefault();var u=document.getElementById('srU').value.trim(),p=document.getElementById('srP').value,b=document.getElementById('srBtn'),er=document.getElementById('srErr');er.textContent='';b.disabled=true;b.textContent='Signing in…';fetch(GATE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u:u,p:p})}).then(function(r){return r.json()}).then(function(d){if(d&&d.ok){document.cookie='sr_gate='+encodeURIComponent(d.token)+'; domain=.smithapprovesme.com; path=/; max-age=2592000; secure; samesite=Lax';reveal()}else{er.textContent='Wrong username or password.';b.disabled=false;b.textContent='Sign in'}}).catch(function(){er.textContent='Could not reach the server. Try again.';b.disabled=false;b.textContent='Sign in'})})})();</script>

<header class="app-header">
  <div class="brand-mark">S</div>
  <div><div class="eyebrow">Prospecting</div><div class="htitle">Agent Call Block</div></div>
  <div class="counts"><b id="cRemain">—</b><span>agents left</span></div>
</header>

<div class="wrap">
  <div class="progress">
    <div class="ptrack"><div class="pfill" id="pfill"></div></div>
    <div class="ptext" id="ptext">0 of 10 today</div>
  </div>
  <div id="list"><div class="loading">Loading your agents…</div></div>
</div>

<div class="toast" id="toast">Saved</div>

<script>
var API="https://qfhfuesnjfuwfujhvgpa.supabase.co/functions/v1/agent-calls";
var K="sr-coach-7f3a91c8b2";
var REPORT="https://partners.smithapprovesme.com";           // The Smith Report link that gets texted
var GOAL=10;
var listEl=document.getElementById('list'),toast=document.getElementById('toast');
var today=new Date().toISOString().slice(0,10);
var doneToday=0; try{var s=JSON.parse(localStorage.getItem('agentcalls_done')||'{}'); if(s.date===today) doneToday=s.n||0;}catch(e){}
function saveDone(){try{localStorage.setItem('agentcalls_done',JSON.stringify({date:today,n:doneToday}));}catch(e){}}
function flash(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){toast.classList.remove('show')},1400);}
function updProgress(){document.getElementById('pfill').style.width=Math.min(doneToday/GOAL*100,100)+'%';document.getElementById('ptext').textContent=doneToday+' of '+GOAL+' today';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cleanName(c){var n=c.contact_name||c.first_name||'Agent';n=n.replace(/^\s*[^-]*-\s*/,'');return n.trim()||c.first_name||'Agent';}
function msgFor(c){return "Hi "+(c.first_name||'there')+", it's Scott Smith. You're a realtor in my phone, so at some point we've talked through a real estate deal together. I built a weekly Denver market report for agents and wanted to send it your way: "+REPORT+". Would love your honest thoughts.";}
function card(c){
  var name=cleanName(c), tel='+1'+c.phone10, body=encodeURIComponent(msgFor(c));
  var retry=c.calls>0?'<span class="tag retry">Call '+(c.calls+1)+' · no answer yet</span>':'';
  var el=document.createElement('div');el.className='card';el.dataset.id=c.id;
  el.innerHTML=
    '<h3 class="aname">'+esc(name)+'</h3>'+retry+
    '<div class="phone">'+esc(c.phone_display||c.phone10)+'</div>'+
    '<div class="acts">'+
      '<a class="call" href="tel:'+tel+'">📞 Call</a>'+
      '<a class="text" href="sms:'+tel+'?&body='+body+'">💬 Text report</a>'+
    '</div>'+
    '<div class="row2">'+
      '<button class="worked" data-a="worked">Texted ✓</button>'+
      '<button class="na" data-a="no_answer">No answer</button>'+
      '<button class="skip" data-a="skip">Skip</button>'+
    '</div>';
  el.querySelectorAll('button').forEach(function(b){b.onclick=function(){act(c.id,b.dataset.a,el);};});
  return el;
}
function act(id,action,el){
  el.querySelectorAll('button,a').forEach(function(x){x.style.pointerEvents='none';});
  el.classList.add('done');
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({k:K,id:id,action:action})})
    .then(function(r){return r.json()}).then(function(d){
      if(!d||!d.ok){flash('Save failed — try again');el.classList.remove('done');el.querySelectorAll('button,a').forEach(function(x){x.style.pointerEvents='';});return;}
      if(action==='worked'){doneToday++;saveDone();updProgress();flash('Logged ✓');}
      else if(action==='no_answer'){flash('Marked no-answer');}
      else{flash('Skipped');}
      setTimeout(function(){el.remove();if(!listEl.querySelector('.card'))load();},260);
    }).catch(function(){flash('Network error');el.classList.remove('done');el.querySelectorAll('button,a').forEach(function(x){x.style.pointerEvents='';});});
}
function load(){
  listEl.innerHTML='<div class="loading">Loading your agents…</div>';
  fetch(API+'?data=1&k='+K+'&n=10').then(function(r){return r.json()}).then(function(d){
    document.getElementById('cRemain').textContent=(d.active_remaining!=null?d.active_remaining.toLocaleString():'—');
    updProgress();
    if(!d.list||!d.list.length){listEl.innerHTML='<div class="empty"><h2>All caught up 🎉</h2>No more active agents in the queue.</div>';return;}
    listEl.innerHTML='';
    if(doneToday>=GOAL){
      var b=document.createElement('div');b.className='empty';
      b.innerHTML='<h2>That’s your 10 for today ✅</h2>Nice work. You can keep going or come back tomorrow.<br><button class="bigbtn" id="more">Keep going</button>';
      listEl.appendChild(b);
      document.getElementById('more').onclick=function(){b.remove();d.list.forEach(function(c){listEl.appendChild(card(c));});};
      return;
    }
    d.list.forEach(function(c){listEl.appendChild(card(c));});
    var h=document.createElement('div');h.className='hint';h.innerHTML='Tap <b>Call</b>, then <b>Text report</b> (opens Messages ready to send), then mark <b>Texted ✓</b>. Do ~10 a day.';
    listEl.appendChild(h);
  }).catch(function(){listEl.innerHTML='<div class="empty">Could not load. Pull to refresh or try again.</div>';});
}
load();
</script>
</body>
</html>
